openapi: 3.0.3
info:
  title: Helpdesk API
  version: 1.0.0
  description: Cookie-authenticated helpdesk backend.
servers:
  - url: http://localhost:4321
tags:
  - name: Authentication
  - name: Branches
  - name: Health
paths:
  /auth/sign-up:
    post:
      tags: [Authentication]
      summary: Create a user
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: User created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permission
        '409':
          description: Email already exists
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Authenticated; tokens are set as HttpOnly cookies
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limit exceeded
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Renew the access token
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Access token renewed in the cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session and clear cookies
      responses:
        '200':
          description: Logout is idempotent
  /auth/validate:
    get:
      tags: [Authentication]
      summary: Validate the access-token session
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '200':
          description: Generic response, regardless of account existence
        '503':
          description: Email delivery is unavailable
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a password and revoke active sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 5, maxLength: 100 }
      responses:
        '200':
          description: Password reset
        '401':
          $ref: '#/components/responses/Unauthorized'
  /branches:
    get:
      tags: [Branches]
      summary: List non-administrative branches
      responses:
        '200':
          description: Branch list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Branch' }
  /branches/all:
    get:
      tags: [Branches]
      summary: List all branches
      security:
        - accessCookie: []
      responses:
        '200':
          description: Branch list
        '403':
          description: Missing permission or administrative branch
  /branches/create:
    post:
      tags: [Branches]
      summary: Create a branch
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Branch created
        '409':
          description: Branch name already exists
  /health:
    get:
      tags: [Health]
      summary: Check API and database availability
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: up }
                  timestamp: { type: string, format: date-time }
        '503':
          description: Database is unavailable
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    Login:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 5, maxLength: 255 }
    CreateUser:
      type: object
      required: [email, password, branches]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 5, maxLength: 100 }
        branches:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    AuthenticatedUser:
      type: object
      required: [id, email, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string }
    LoginResponse:
      type: object
      required: [expiresAt, userInfo]
      properties:
        expiresAt: { type: string, format: date-time }
        userInfo: { $ref: '#/components/schemas/AuthenticatedUser' }
    RefreshResponse:
      type: object
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }
    Branch:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Error:
      type: object
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        path: { type: string }
        timestamp: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Payload validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
